server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Chỉ áp dụng schema nghiệp vụ; tuyệt đối không nạp db/demo vào production.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS}
ai-service.base-url=${AI_SERVICE_BASE_URL}
jwt.base64-secret=${JWT_BASE64_SECRET}
jwt.access-token-validity-in-seconds=${JWT_ACCESS_TOKEN_VALIDITY_IN_SECONDS:3600}

# Ngưỡng rule engine cảnh báo; production bắt buộc cấu hình tường minh qua biến môi trường.
alerts.speed-limit-kmh=${ALERTS_SPEED_LIMIT_KMH}
alerts.route-deviation-meters=${ALERTS_ROUTE_DEVIATION_METERS}
alerts.abnormal-stop-minutes=${ALERTS_ABNORMAL_STOP_MINUTES}
alerts.continuous-driving-minutes=${ALERTS_CONTINUOUS_DRIVING_MINUTES}
alerts.gps-signal-timeout-minutes=${ALERTS_GPS_SIGNAL_TIMEOUT_MINUTES}
alerts.document-expiry-warning-days=${ALERTS_DOCUMENT_EXPIRY_WARNING_DAYS}
alerts.duplicate-suppression-hours=${ALERTS_DUPLICATE_SUPPRESSION_HOURS}
alerts.check-interval-ms=${ALERTS_CHECK_INTERVAL_MS:60000}
alerts.check-initial-delay-ms=${ALERTS_CHECK_INITIAL_DELAY_MS:30000}
