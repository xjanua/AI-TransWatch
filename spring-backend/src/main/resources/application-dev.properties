server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_transwatch}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

spring.flyway.enabled=true
# `db/demo` chỉ chứa tài khoản/dữ liệu mô phỏng phục vụ phát triển và bảo vệ.
spring.flyway.locations=classpath:db/migration,classpath:db/demo

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}
ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}

# Ngưỡng rule engine cảnh báo (giá trị mặc định dùng cho demo đồ án)
alerts.speed-limit-kmh=${ALERTS_SPEED_LIMIT_KMH:80}
alerts.route-deviation-meters=${ALERTS_ROUTE_DEVIATION_METERS:300}
alerts.abnormal-stop-minutes=${ALERTS_ABNORMAL_STOP_MINUTES:15}
alerts.continuous-driving-minutes=${ALERTS_CONTINUOUS_DRIVING_MINUTES:240}
alerts.gps-signal-timeout-minutes=${ALERTS_GPS_SIGNAL_TIMEOUT_MINUTES:10}
alerts.document-expiry-warning-days=${ALERTS_DOCUMENT_EXPIRY_WARNING_DAYS:30}
alerts.duplicate-suppression-hours=${ALERTS_DUPLICATE_SUPPRESSION_HOURS:6}
alerts.check-interval-ms=${ALERTS_CHECK_INTERVAL_MS:60000}
alerts.check-initial-delay-ms=${ALERTS_CHECK_INITIAL_DELAY_MS:30000}

jwt.base64-secret=${JWT_BASE64_SECRET}
jwt.access-token-validity-in-seconds=${JWT_ACCESS_TOKEN_VALIDITY_IN_SECONDS:3600}
